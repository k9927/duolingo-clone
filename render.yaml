# Render blueprint for the FastAPI backend (the frontend deploys to Vercel).
services:
  - type: web
    name: duolingo-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Any https://*.vercel.app origin is already allowed (CORS_ORIGIN_REGEX in app/config.py);
      # list extra origins here, comma-separated, e.g. a custom domain.
      - key: CORS_ORIGINS
        value: http://localhost:3000
